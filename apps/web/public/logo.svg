<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" width="240" height="64">
  <defs>
    <linearGradient id="fc-grad-primary" x1="6" y1="8" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="fc-grad-cutter" x1="28" y1="6" x2="58" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="fc-bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="fc-border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="fc-text-clip-grad" x1="140" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(0, 0)">
    <!-- Squircle Frame -->
    <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#fc-bg-grad)" stroke="url(#fc-border-grad)" stroke-width="1.5"/>

    <!-- Film Strip Micro-Perforations -->
    <rect x="42" y="9" width="3.5" height="3.5" rx="1" fill="#38bdf8" fill-opacity="0.8" />
    <rect x="48" y="13" width="3.5" height="3.5" rx="1" fill="#38bdf8" fill-opacity="0.5" />

    <!-- Primary Forward Play Triangle / Film Blade -->
    <path d="M 21 16 C 21 14.2 23 13.1 24.5 14 L 45.5 26.2 C 47.2 27.2 47.2 29.8 45.5 30.8 L 33 38 L 27 34.5 L 36 29 L 23 21.5 L 23 45 C 23 46.8 21 47.8 19.5 46.8 C 19 46.4 18.5 45.5 18.5 44 L 18.5 18.5 C 18.5 17.1 19.6 16 21 16 Z" fill="url(#fc-grad-primary)"/>

    <!-- Lower Play & Crop Blade Anchor -->
    <path d="M 26 37 L 45.2 32.8 C 46.8 32.4 48.2 34 47.6 35.5 L 43.5 44 C 42.8 45.4 41.2 46.2 39.7 45.8 L 24.5 41.5 Z" fill="url(#fc-grad-cutter)"/>

    <!-- Center Precision Crop Indicator Point -->
    <circle cx="31.5" cy="28.5" r="2" fill="#38bdf8" />
  </g>

  <!-- Wordmark -->
  <text x="76" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">Free<tspan fill="url(#fc-text-clip-grad)">Clip</tspan></text>
</svg>
